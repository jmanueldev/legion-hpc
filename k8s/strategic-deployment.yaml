apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategic-orchestrator
  namespace: legionx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strategic-orchestrator
  template:
    metadata:
      labels:
        app: strategic-orchestrator
    spec:
      containers:
        - name: strategic-orchestrator
          image: legionx-strategic:latest
