apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legionx-node-hpa
  namespace: legionx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legionx-node
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
